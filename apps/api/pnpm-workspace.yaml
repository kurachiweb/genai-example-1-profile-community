# コンテナ内の単体インストール(/workspace=apps/api)向け pnpm 設定。
# 各アプリコンテナは自身の apps/api を /workspace にバインドするため、本ファイルはそのまま
# /workspace/pnpm-workspace.yaml として参照される(compose.yaml での個別マウントは不要)。
# pnpm 11 は package.json の "pnpm" フィールドを読まないため、ネイティブ依存のビルド許可
# (allowBuilds)はこの pnpm-workspace.yaml に置く必要がある。
# allowBuilds の正本はルート pnpm-workspace.yaml。ここはコンテナ単体インストール用の再掲。
# ルートの monorepo インストールでは、ワークスペースメンバー(apps/*)配下の本ファイルは
# 無視されるため、ルートのワークスペース解決には影響しない。
packages:
  - .
allowBuilds:
  '@apollo/protobufjs': true
  '@scarf/scarf': false
  better-sqlite3: true
  esbuild: true
  sharp: true
  sqlite3: true
  unrs-resolver: true
  workerd: true
