# pnpm ワークスペースのパッケージ定義。
# package.json を持つ apps/ 配下のみが対象になる(未実装ディレクトリは無視される)。
# 依存パッケージの postinstall ビルド許可は本ファイルで集約する
# (CLAUDE.md: pnpm-workspace.yaml は allowBuilds 設定の正本)。
packages:
  - apps/*
# postinstall ビルドを許可する依存(ネイティブ/プロトコル生成)。
# apps/api: MikroORM の SQLite ドライバ(sqlite3 ネイティブ)・Apollo の protobufjs ビルド。
allowBuilds:
  '@apollo/protobufjs': true
  sqlite3: true
