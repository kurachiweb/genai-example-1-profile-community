# pnpm ワークスペースのパッケージ定義。
# package.json を持つ apps/ 配下のみが対象になる(未実装ディレクトリは無視される)。
# 依存パッケージの postinstall ビルド許可は本ファイルで集約する
# (CLAUDE.md: pnpm-workspace.yaml は allowBuilds 設定の正本)。
packages:
  - apps/*
# postinstall ビルドを許可する依存(ネイティブ/プロトコル生成)。
# apps/api: MikroORM の SQLite ドライバ(sqlite3 ネイティブ)・Apollo の protobufjs ビルド。
allowBuilds:
  '@apollo/protobufjs': true
  # apps/public-api 依存(@nestjs/swagger 経由)の透過的テレメトリ。ビルドスクリプトは実行しない。
  '@scarf/scarf': false
  better-sqlite3: true
  sqlite3: true
  unrs-resolver: true
# パッケージの公開から3日以上経過したもののみをインストールする
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@nestjs/common@11.1.27'
  - '@nestjs/core@11.1.27'
  - '@nestjs/platform-express@11.1.27'
  - '@nestjs/testing@11.1.27'
  - '@typescript-eslint/eslint-plugin@8.61.1'
  - '@typescript-eslint/parser@8.61.1'
  - '@typescript-eslint/project-service@8.61.1'
  - '@typescript-eslint/scope-manager@8.61.1'
  - '@typescript-eslint/tsconfig-utils@8.61.1'
  - '@typescript-eslint/type-utils@8.61.1'
  - '@typescript-eslint/types@8.61.1'
  - '@typescript-eslint/typescript-estree@8.61.1'
  - '@typescript-eslint/utils@8.61.1'
  - '@typescript-eslint/visitor-keys@8.61.1'
  - graphql@17.0.0
  - typescript-eslint@8.61.1
