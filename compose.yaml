# ローカル開発用 docker compose 定義。
# 本番ランタイムは Cloudflare Workers のため、本 compose はローカル開発専用である。
# ポート割り当ての正本は CLAUDE.md / docs/GUIDES/infra/00-overview.md §2（48030〜48034）。
name: genai-example-1-profile-community

# 各アプリサービスの共通設定（DRY: YAML アンカーで集約。03-docker.md §4）。
# volumes はサービスごとにマウント構成が異なるため共通化せず、各サービスで個別に定義する。
# node_modules はホストと混ぜず名前付きボリュームでコンテナ側に隔離する。
x-app-defaults: &app-defaults
  restart: unless-stopped
  init: true
  env_file:
    - path: .env
      required: false
  environment:
    NODE_ENV: development

services:
  # ---- ツールチェーン: pnpm / Terraform / wrangler を備えた常駐コンテナ ----
  # 使い方: docker compose exec root pnpm <...> / terraform <...> / wrangler <...>
  root:
    build:
      context: .
      dockerfile: Dockerfile
    image: genai-example-1-profile-community/root
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - ./apps/frontend-lib:/workspace/apps/client/lib
      - ./apps/frontend-lib:/workspace/apps/admin/lib
      - frontend_lib_node_modules:/workspace/lib/node_modules
    env_file:
      - path: .env
        required: false

  # ---- DB: スキーマ定義・マイグレーション（SQLite / MikroORM, :48030） ----
  db:
    <<: *app-defaults
    build:
      context: .
      dockerfile: apps/db/Dockerfile
    ports:
      - "48030:48030"
    volumes:
      - ./apps/db:/workspace
      - db_node_modules:/workspace/node_modules
      - db_data:/workspace/.data
    command: sh -lc "pnpm install && pnpm dev"
    healthcheck:
      # SQLite はサーバーレスのため、dev サーバーのポート開放を疎通確認に用いる。
      test:
        - CMD
        - node
        - -e
        - require('net').connect(48030,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ---- 内部 API: NestJS + Hono + Apollo Server / GraphQL（:48031） ----
  api:
    <<: *app-defaults
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "48031:48031"
    # 単体マウント(/workspace=apps/api)でのネイティブ依存ビルド許可は apps/api/pnpm-workspace.yaml
    # で与える(apps/api のバインドに含まれ /workspace/pnpm-workspace.yaml として参照されるため
    # 個別マウントは不要。pnpm 11 は package.json の "pnpm" を読まないため allowBuilds をここに置く)。
    volumes:
      - ./apps/api:/workspace
      - api_node_modules:/workspace/node_modules
      # 生成AI用
      - ./.aidlc-rule-details:/workspace/.aidlc-rule-details:ro
      - ./.claude:/workspace/.claude:ro
      - ./aidlc-docs:/workspace/aidlc-docs:ro
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # ---- 利用者・閲覧者向け Web: Next.js（:48032） ----
  client:
    <<: *app-defaults
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    ports:
      - "48032:48032"
    # 共有フロントエンド(apps/frontend-lib)を /workspace/lib にマウントし、コンテナ内のミニ
    # ワークスペース(apps/client/pnpm-workspace.yaml の packages: ['.', 'lib'])で
    # @app/frontend-lib(workspace:*)を解決する(ワークスペース定義はバインドに含まれ個別マウント不要)。
    volumes:
      - ./apps/client:/workspace
      - client_node_modules:/workspace/node_modules
      - ./apps/frontend-lib:/workspace/lib
      - frontend_lib_node_modules:/workspace/lib/node_modules
      # 生成AI用
      - ./.aidlc-rule-details:/workspace/.aidlc-rule-details:ro
      - ./.claude:/workspace/.claude:ro
      - ./aidlc-docs:/workspace/aidlc-docs:ro
    depends_on:
      api:
        condition: service_started

  # ---- 管理者コンソール Web: Next.js（:48033） ----
  admin:
    <<: *app-defaults
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    ports:
      - "48033:48033"
    # 共有フロントエンド(apps/frontend-lib)を /workspace/lib にマウントし、コンテナ内のミニ
    # ワークスペース(apps/admin/pnpm-workspace.yaml の packages: ['.', 'lib'])で
    # @app/frontend-lib(workspace:*)を解決する(ワークスペース定義はバインドに含まれ個別マウント不要)。
    volumes:
      - ./apps/admin:/workspace
      - admin_node_modules:/workspace/node_modules
      - ./apps/frontend-lib:/workspace/lib
      - frontend_lib_node_modules:/workspace/lib/node_modules
      # 生成AI用
      - ./.aidlc-rule-details:/workspace/.aidlc-rule-details:ro
      - ./.claude:/workspace/.claude:ro
      - ./aidlc-docs:/workspace/aidlc-docs:ro
    depends_on:
      api:
        condition: service_started

  # ---- 公開 API: NestJS + Hono / REST（:48034） ----
  public-api:
    <<: *app-defaults
    build:
      context: .
      dockerfile: apps/public-api/Dockerfile
    ports:
      - "48034:48034"
    # 単体マウント(/workspace=apps/public-api)でのネイティブ依存ビルド許可は
    # apps/public-api/pnpm-workspace.yaml で与える(apps/public-api のバインドに含まれ
    # /workspace/pnpm-workspace.yaml として参照されるため個別マウントは不要)。
    volumes:
      - ./apps/public-api:/workspace
      - public_api_node_modules:/workspace/node_modules
      # 生成AI用
      - ./.aidlc-rule-details:/workspace/.aidlc-rule-details:ro
      - ./.claude:/workspace/.claude:ro
      - ./aidlc-docs:/workspace/aidlc-docs:ro
    depends_on:
      db:
        condition: service_healthy

  # ---- Mailpit: Amazon SES のローカル代替（SMTP:1025 はサービス間のみ） ----
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "48035:8025"
    volumes:
      - mailpit_data:/data
    environment:
      MP_MAX_MESSAGES: "500"
      MP_DATABASE: /data/mailpit.db

volumes:
  root_node_modules:
  db_node_modules:
  api_node_modules:
  client_node_modules:
  admin_node_modules:
  public_api_node_modules:
  frontend_lib_node_modules:
  db_data:
  mailpit_data:
