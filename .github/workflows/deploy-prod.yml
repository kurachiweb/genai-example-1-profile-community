name: Deploy (production)

# 作業者が main へ `git tag`(例: v1.2.0)を push するのをトリガーに production 環境へ
# デプロイする(docs/GUIDES/infra/02-deployment.md §4.3、CLAUDE.md デプロイ方針)。
# AIエージェントはこのワークフローを起動する操作(タグ付け・push)を行わない。
# main が CI(ci.yml)緑であることを人間が確認したうえでタグを付与する運用とする。
#
# 人間の承認ゲート: 各ジョブは GitHub Environment `genai-example-1-production` を参照する。
# このワークフロー自体はゲートを実装しない(GitHub 側の Environment protection rule
# 「Required reviewers」をリポジトリ設定で有効化することで、ジョブ実行前に人間の承認を
# 挟む運用とする。設定手順は apps/infra/README.md・docs/GUIDES/infra/02-deployment.md 参照)。
on:
  push:
    tags: ['v*']

# production デプロイの同時実行は避ける(D1マイグレーション・Terraform apply の競合防止、
# deploy-dev.yml と同じ理由)。
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '26'
  # タグ push がトリガーのため、タグが指す commit をデプロイ対象にする。
  DEPLOY_REF: ${{ github.sha }}

jobs:
  terraform-apply:
    name: Terraform適用(production)
    runs-on: ubuntu-latest
    environment: genai-example-1-production
    outputs:
      d1_database_id: ${{ steps.tf-outputs.outputs.d1_database_id }}
      kv_session_client_id: ${{ steps.tf-outputs.outputs.kv_session_client_id }}
      kv_session_admin_id: ${{ steps.tf-outputs.outputs.kv_session_admin_id }}
      kv_app_id: ${{ steps.tf-outputs.outputs.kv_app_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      # endpoints(ネストしたマップ)は -backend-config="key=value" では渡せないため、
      # 一時的なバックエンド設定ファイルを生成して渡す(apps/infra/README.md 参照)。
      - name: terraform init
        working-directory: apps/infra
        run: |
          cat > /tmp/backend.hcl <<EOF
          access_key = "${{ secrets.CLOUDFLARE_S3_ACCESS_KEY_ID }}"
          secret_key = "${{ secrets.CLOUDFLARE_S3_SECRET_ACCESS_KEY }}"
          endpoints = { s3 = "${{ secrets.CLOUDFLARE_S3_API_ENDPOINT }}" }
          EOF
          terraform init -backend-config=/tmp/backend.hcl
          rm -f /tmp/backend.hcl

      # production ワークスペースは初回デプロイ時点でまだ存在しない可能性があるため、
      # select に失敗したら new で作成する(dev は Unit1 で作成済みのため select のみで足りる)。
      - name: terraform workspace select production
        working-directory: apps/infra
        run: terraform workspace select production || terraform workspace new production

      - name: terraform apply
        working-directory: apps/infra
        run: terraform apply -var-file=production.tfvars -auto-approve
        env:
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # D1/KV は production ワークスペースの初回 apply でリソースが新規作成されるため、
      # IDが実行時まで確定しない(dev のように wrangler.jsonc へ値を固定できない)。
      # 後続ジョブ(migrate-d1・deploy-api・deploy-public-api)へ output 経由で渡す。
      - name: Terraform出力を取得
        id: tf-outputs
        working-directory: apps/infra
        run: |
          echo "d1_database_id=$(terraform output -raw d1_database_id)" >> "$GITHUB_OUTPUT"
          echo "kv_session_client_id=$(terraform output -raw kv_namespace_session_client_id)" >> "$GITHUB_OUTPUT"
          echo "kv_session_admin_id=$(terraform output -raw kv_namespace_session_admin_id)" >> "$GITHUB_OUTPUT"
          echo "kv_app_id=$(terraform output -raw kv_namespace_app_id)" >> "$GITHUB_OUTPUT"

  migrate-d1:
    name: D1マイグレーション適用(production)
    # production の D1 は terraform-apply で新規作成されうるため、dev と異なり依存させる
    # (dev は Unit1 で D1 が作成済みのため guard のみに依存し並行実行していた)。
    needs: terraform-apply
    runs-on: ubuntu-latest
    environment: genai-example-1-production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # マイグレーションの正本は apps/api(ADR 20260617)。apps/public-api は同一 D1 を参照するのみ。
      # `wrangler d1 migrations apply --remote` の既知の不具合を回避する自前スクリプトを使う
      # (apps/api/scripts/apply-remote-migrations.ts、deploy-dev.yml と同じ理由)。
      - name: マイグレーション適用(wrangler d1 execute --file 経由)
        working-directory: apps/api
        run: pnpm migration:apply-remote genai-example-1-production production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-api:
    name: apps/api デプロイ(production)
    needs: [migrate-d1, terraform-apply]
    runs-on: ubuntu-latest
    environment: genai-example-1-production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # wrangler.jsonc の production ブロックは D1/KV の ID を空文字で持つ(未確定のため
      # コミットできない、apps/infra/README.md §出力の使い方)。terraform-apply の出力を
      # デプロイ直前にこのチェックアウト内でのみ書き込む(コミットには影響しない)。
      # JSONC のコメントを壊さないよう、対象行をピンポイントに置換する(JSON全体の
      # パース・再シリアライズはコメントを失うため行わない)。
      - name: wrangler.jsonc へ Terraform 出力を反映(production)
        working-directory: apps/api
        run: |
          sed -i \
            -e "s#\"database_id\": \"\"#\"database_id\": \"${D1_DATABASE_ID}\"#" \
            -e "s#{ \"binding\": \"SESSION_CLIENT_KV\", \"id\": \"\" }#{ \"binding\": \"SESSION_CLIENT_KV\", \"id\": \"${KV_SESSION_CLIENT_ID}\" }#" \
            -e "s#{ \"binding\": \"SESSION_ADMIN_KV\", \"id\": \"\" }#{ \"binding\": \"SESSION_ADMIN_KV\", \"id\": \"${KV_SESSION_ADMIN_ID}\" }#" \
            -e "s#{ \"binding\": \"APP_KV\", \"id\": \"\" }#{ \"binding\": \"APP_KV\", \"id\": \"${KV_APP_ID}\" }#" \
            wrangler.jsonc
        env:
          D1_DATABASE_ID: ${{ needs.terraform-apply.outputs.d1_database_id }}
          KV_SESSION_CLIENT_ID: ${{ needs.terraform-apply.outputs.kv_session_client_id }}
          KV_SESSION_ADMIN_ID: ${{ needs.terraform-apply.outputs.kv_session_admin_id }}
          KV_APP_ID: ${{ needs.terraform-apply.outputs.kv_app_id }}

      # PBKDF2 のイテレーション数上限(100,000)を補うペッパー(password-hasher.ts)。
      # dev と同じ理由で、値は固定のまま流し込むだけ(CI実行のたびに生成し直さない)。
      - name: PASSWORD_PEPPER 設定(production)
        working-directory: apps/api
        run: echo "$PASSWORD_PEPPER_VALUE" | pnpm exec wrangler secret put PASSWORD_PEPPER --env production
        env:
          PASSWORD_PEPPER_VALUE: ${{ secrets.PASSWORD_PEPPER }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # メール送信(Amazon SES、ses-mail-sender.ts)。PASSWORD_PEPPER と同型で、
      # deploy 直前に GitHub Environment Secrets の値を Wrangler Secrets へ流し込む。
      - name: メール送信(SES)関連シークレット設定(production)
        working-directory: apps/api
        run: |
          echo "$MAIL_FROM_VALUE" | pnpm exec wrangler secret put MAIL_FROM --env production
          echo "$AWS_DEFAULT_REGION_VALUE" | pnpm exec wrangler secret put AWS_DEFAULT_REGION --env production
          echo "$AWS_SES_ACCESS_KEY_ID_VALUE" | pnpm exec wrangler secret put AWS_SES_ACCESS_KEY_ID --env production
          echo "$AWS_SES_SECRET_ACCESS_KEY_VALUE" | pnpm exec wrangler secret put AWS_SES_SECRET_ACCESS_KEY --env production
        env:
          MAIL_FROM_VALUE: ${{ secrets.MAIL_FROM }}
          AWS_DEFAULT_REGION_VALUE: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_SES_ACCESS_KEY_ID_VALUE: ${{ secrets.AWS_SES_ACCESS_KEY_ID }}
          AWS_SES_SECRET_ACCESS_KEY_VALUE: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: wrangler deploy
        run: pnpm --filter @app/api deploy:worker:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-public-api:
    name: apps/public-api デプロイ(production)
    needs: [migrate-d1, terraform-apply]
    runs-on: ubuntu-latest
    environment: genai-example-1-production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # apps/api と同一 D1 を参照する(ADR 20260617)。KVバインディングは持たない。
      - name: wrangler.jsonc へ Terraform 出力を反映(production)
        working-directory: apps/public-api
        run: |
          sed -i "s#\"database_id\": \"\"#\"database_id\": \"${D1_DATABASE_ID}\"#" wrangler.jsonc
        env:
          D1_DATABASE_ID: ${{ needs.terraform-apply.outputs.d1_database_id }}

      - name: wrangler deploy
        run: pnpm --filter @app/public-api deploy:worker:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-client:
    name: apps/client デプロイ(production)
    # デプロイ順序: マイグレーション → api/public-api → client/admin(infra/02-deployment.md §3)。
    needs: [deploy-api, deploy-public-api]
    runs-on: ubuntu-latest
    environment: genai-example-1-production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 共有フロントエンド(apps/frontend-lib)を apps/client/lib へ供給する(@lib エイリアスの実体、
      # ci.yml/deploy-dev.yml と同じ理由。ローカルはdocker composeのバインドマウントで供給される)。
      - name: 共有フロントエンド(lib)をシンボリックリンクで配置
        run: ln -s "$(pwd)/apps/frontend-lib" apps/client/lib

      # apps/client/pnpm-lock.yaml はコンテナ単体インストール用(docker composeでのローカル開発)。
      # これが存在するとopennextjs-cloudflareのモノレポルート自動検出がapps/client自身を
      # ルートと誤認し、モノレポルートにホイストされているnextパッケージを解決できず
      # Turbopackビルドが失敗する(実機で確認済み、deploy-dev.yml と同じ理由)。
      - name: apps/client/pnpm-lock.yamlを削除(モノレポルート誤検出の回避)
        run: rm -f apps/client/pnpm-lock.yaml

      - name: opennextjs-cloudflare build && deploy
        run: pnpm --filter @app/client deploy:cloudflare:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-admin:
    name: apps/admin デプロイ(production)
    needs: [deploy-api, deploy-public-api]
    runs-on: ubuntu-latest
    environment: genai-example-1-production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 共有フロントエンド(apps/frontend-lib)を apps/admin/lib へ供給する(@lib エイリアスの実体、
      # ci.yml/deploy-dev.yml と同じ理由。ローカルはdocker composeのバインドマウントで供給される)。
      - name: 共有フロントエンド(lib)をシンボリックリンクで配置
        run: ln -s "$(pwd)/apps/frontend-lib" apps/admin/lib

      # apps/admin/pnpm-lock.yaml はコンテナ単体インストール用(docker composeでのローカル開発)。
      # これが存在するとopennextjs-cloudflareのモノレポルート自動検出がapps/admin自身を
      # ルートと誤認し、モノレポルートにホイストされているnextパッケージを解決できず
      # Turbopackビルドが失敗する(実機で確認済み、deploy-dev.yml と同じ理由)。
      - name: apps/admin/pnpm-lock.yamlを削除(モノレポルート誤検出の回避)
        run: rm -f apps/admin/pnpm-lock.yaml

      - name: opennextjs-cloudflare build && deploy
        run: pnpm --filter @app/admin deploy:cloudflare:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
