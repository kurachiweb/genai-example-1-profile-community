name: Deploy (dev)

# main への push で CI(ci.yml)が成功した後、dev 環境へ自動デプロイする
# (docs/GUIDES/infra/02-deployment.md §2・§3、CLAUDE.md デプロイ方針)。
# デプロイ方式は Cloudflare Deploy Hook ではなく、本ワークフローから `wrangler deploy` を直接実行する
# (Deploy Hook は Pages 専用機能のため不採用)。
# 手動再実行(workflow_dispatch)にも対応する。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# dev デプロイの同時実行は避ける(D1マイグレーション・Terraform apply の競合防止)。
# 実行中のデプロイを取り消すと中途半端な状態になり得るため cancel-in-progress は無効にする。
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  NODE_VERSION: '26'
  # workflow_run 経由の場合はトリガー元ワークフローが検証した commit を、
  # workflow_dispatch(手動実行)の場合は現在の main の HEAD をデプロイ対象にする。
  DEPLOY_REF: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  guard:
    name: デプロイ条件確認
    # workflow_run 経由なら CI 成功時のみ、workflow_dispatch(手動)なら常に進む。
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI succeeded (or manual dispatch). Proceeding with dev deploy."

  migrate-d1:
    name: D1マイグレーション適用(dev)
    needs: guard
    runs-on: ubuntu-latest
    environment: genai-example-1-dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # マイグレーションの正本は apps/api(ADR 20260617)。apps/public-api は同一 D1 を参照するのみ。
      # `wrangler d1 migrations apply --remote` は CREATE TRIGGER(BEGIN...END を含む複数文)を
      # 含むSQLで "incomplete input: SQLITE_ERROR" になる既知の不具合があるため(実機で確認済み)、
      # `wrangler d1 execute --file=` 経由で同等の追跡を行う自前スクリプトを使う
      # (apps/api/scripts/apply-remote-migrations.ts 参照)。
      - name: マイグレーション適用(wrangler d1 execute --file 経由)
        working-directory: apps/api
        run: pnpm migration:apply-remote genai-example-1-dev dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  terraform-apply:
    name: Terraform適用(dev)
    needs: guard
    runs-on: ubuntu-latest
    environment: genai-example-1-dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      # endpoints(ネストしたマップ)は -backend-config="key=value" では渡せないため、
      # 一時的なバックエンド設定ファイルを生成して渡す(apps/infra/README.md 参照)。
      - name: terraform init
        working-directory: apps/infra
        run: |
          cat > /tmp/backend.hcl <<EOF
          access_key = "${{ secrets.CLOUDFLARE_S3_ACCESS_KEY_ID }}"
          secret_key = "${{ secrets.CLOUDFLARE_S3_SECRET_ACCESS_KEY }}"
          endpoints = { s3 = "${{ secrets.CLOUDFLARE_S3_API_ENDPOINT }}" }
          EOF
          terraform init -backend-config=/tmp/backend.hcl
          rm -f /tmp/backend.hcl

      - name: terraform workspace select dev
        working-directory: apps/infra
        run: terraform workspace select dev

      - name: terraform apply
        working-directory: apps/infra
        run: terraform apply -var-file=dev.tfvars -auto-approve
        env:
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-api:
    name: apps/api デプロイ(dev)
    needs: [migrate-d1, terraform-apply]
    runs-on: ubuntu-latest
    environment: genai-example-1-dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # PBKDF2 のイテレーション数上限(100,000)を補うペッパー。GitHub Actions Secrets の
      # 固定値をそのまま設定するだけで、CI 実行のたびに値を生成し直すことは絶対にしない
      # (ペッパーが変わると既存の全パスワードハッシュが検証不能になり、全ユーザーがログイン不能になる)。
      # loadEnv() は起動時に PASSWORD_PEPPER 必須で例外を投げるため、deploy より先に設定する。
      - name: PASSWORD_PEPPER 設定(dev)
        working-directory: apps/api
        run: echo "$PASSWORD_PEPPER_VALUE" | pnpm exec wrangler secret put PASSWORD_PEPPER --env dev
        env:
          PASSWORD_PEPPER_VALUE: ${{ secrets.PASSWORD_PEPPER }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: wrangler deploy
        run: pnpm --filter @app/api deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-public-api:
    name: apps/public-api デプロイ(dev)
    needs: [migrate-d1, terraform-apply]
    runs-on: ubuntu-latest
    environment: genai-example-1-dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: wrangler deploy
        run: pnpm --filter @app/public-api deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-client:
    name: apps/client デプロイ(dev)
    # デプロイ順序: マイグレーション → api/public-api → client/admin(infra/02-deployment.md §3)。
    needs: [deploy-api, deploy-public-api]
    runs-on: ubuntu-latest
    environment: genai-example-1-dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 共有フロントエンド(apps/frontend-lib)を apps/client/lib へ供給する(@lib エイリアスの実体、
      # ci.yml と同じ理由。ローカルはdocker composeのバインドマウントで供給される)。
      - name: 共有フロントエンド(lib)をシンボリックリンクで配置
        run: ln -s "$(pwd)/apps/frontend-lib" apps/client/lib

      # apps/client/pnpm-lock.yaml はコンテナ単体インストール用(docker composeでのローカル開発)。
      # これが存在するとopennextjs-cloudflareのモノレポルート自動検出がapps/client自身を
      # ルートと誤認し、モノレポルートにホイストされているnextパッケージを解決できず
      # Turbopackビルドが失敗する(実機で確認済み)。インストール完了後のこの時点では不要なため、
      # CIチェックアウト内でのみ削除する(リポジトリの追跡ファイルには影響しない)。
      - name: apps/client/pnpm-lock.yamlを削除(モノレポルート誤検出の回避)
        run: rm -f apps/client/pnpm-lock.yaml

      - name: opennextjs-cloudflare build && deploy
        run: pnpm --filter @app/client deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-admin:
    name: apps/admin デプロイ(dev)
    needs: [deploy-api, deploy-public-api]
    runs-on: ubuntu-latest
    environment: genai-example-1-dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 共有フロントエンド(apps/frontend-lib)を apps/admin/lib へ供給する(@lib エイリアスの実体、
      # ci.yml と同じ理由。ローカルはdocker composeのバインドマウントで供給される)。
      - name: 共有フロントエンド(lib)をシンボリックリンクで配置
        run: ln -s "$(pwd)/apps/frontend-lib" apps/admin/lib

      # apps/admin/pnpm-lock.yaml はコンテナ単体インストール用(docker composeでのローカル開発)。
      # これが存在するとopennextjs-cloudflareのモノレポルート自動検出がapps/admin自身を
      # ルートと誤認し、モノレポルートにホイストされているnextパッケージを解決できず
      # Turbopackビルドが失敗する(実機で確認済み)。インストール完了後のこの時点では不要なため、
      # CIチェックアウト内でのみ削除する(リポジトリの追跡ファイルには影響しない)。
      - name: apps/admin/pnpm-lock.yamlを削除(モノレポルート誤検出の回避)
        run: rm -f apps/admin/pnpm-lock.yaml

      - name: opennextjs-cloudflare build && deploy
        run: pnpm --filter @app/admin deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
